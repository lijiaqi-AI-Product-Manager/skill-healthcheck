name: Feature request
description: Suggest a check, an integration, or an output improvement
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. "I can't tell whether an old skill is still used" beats "add a flag".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
      description: If you have an interface in mind (a flag, a command, a `--json` field), sketch it.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Workarounds, other tools, or manual steps.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Local checks
        - Upstream / impact
        - Attribution (why)
        - Session logs (dsh, Claude Code, Codex)
        - Plugins (dsh)
        - Output / i18n
        - Performance
        - Documentation
        - Other
    validations:
      required: true
