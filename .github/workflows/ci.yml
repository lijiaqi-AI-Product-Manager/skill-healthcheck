name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node demo/run.mjs --fast
      - name: Package contents
        run: |
          npm pack --dry-run
          npm pack --dry-run ./packages/dsh-skill-healthcheck

  # The matrix above installs the newest Node 22, so it can never catch "the declared
  # minimum does not actually work". Pin the floor and test it for real.
  minimum-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Older Node must fail with one sentence, not an ESM SyntaxError from a missing zstd export.
  old-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.1'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prints a version and a clear upgrade message
        run: |
          node dist/cli.js --version
          set +e
          out=$(node dist/cli.js check --no-sessions 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" = "2"
          echo "$out" | grep -q "22.19"
