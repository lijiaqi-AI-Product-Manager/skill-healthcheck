version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Types must describe the oldest runtime we support (engines: node >=22.19), or code
      # that only exists in newer Node compiles fine and crashes on 22.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # A compiler major is a migration, not a weekly bump.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: npm
    directory: /packages/dsh-skill-healthcheck
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
